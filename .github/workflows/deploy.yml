name: Test and deploy static Next.js site to GitHub Pages
on:
  push: { branches: [ main ] }
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Test pointer motion
        run: npm run test:unit

      - name: Build static site
        run: npm run build

      - name: Share the static build with test workers
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: out
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: out

  test:
    name: Cypress (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy Firefox runtime dependency
        if: matrix.browser == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y libdbus-glib-1-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@12.0.1

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: static-build
          path: out

      - name: Provision the pinned browser
        run: node scripts/test-browsers.mjs "${{ matrix.browser }}"

      - name: Run Cypress against the shared static build
        id: browser-tests
        # Temporary Edge exception: https://github.com/Stegi56/Portfolio/issues/4
        continue-on-error: ${{ matrix.browser == 'edge' }}
        run: npm run cypress:run -- --browser "${{ matrix.browser }}"
        env:
          PORTFOLIO_SKIP_BUILD: "1"

      - name: Report the temporary Edge failure exception
        if: matrix.browser == 'edge' && steps.browser-tests.outcome == 'failure'
        run: echo "::warning::Pinned Edge 120 failed; temporarily nonblocking under https://github.com/Stegi56/Portfolio/issues/4"

      - name: Save screenshots for review and failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy:
    needs: [build, test]
    # PR and manual runs only validate; deployment follows the merge to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
