name: Test and deploy static Next.js site to GitHub Pages
on:
  push: { branches: [ main ] }
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Build static site
        run: npm run build

      - name: Share the static build with test workers
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: out
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: out

  test:
    name: Cypress (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: mobile
            viewport: mobile
            specs: cypress/e2e/portfolio.cy.ts
          - group: tablet
            viewport: tablet
            specs: cypress/e2e/portfolio.cy.ts
          - group: desktop
            viewport: desktop
            specs: cypress/e2e/portfolio.cy.ts
          - group: regressions-and-pointer
            viewport: all
            specs: cypress/e2e/portfolio-regressions.cy.ts,cypress/e2e/pointer-background.cy.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@12.0.1

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: static-build
          path: out

      - name: Run Cypress against the shared static build
        run: npm run cypress:run -- --spec "${{ matrix.specs }}"
        env:
          PORTFOLIO_SKIP_BUILD: "1"
          PORTFOLIO_VIEWPORT: ${{ matrix.viewport }}

      - name: Save screenshots for review and failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.group }}
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy:
    needs: [build, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
